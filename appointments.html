<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarePulse Health Management System</title>
    <meta name="description" content="A unified healthcare platform connecting patient portals, appointment booking, medical records, electronic prescriptions, billing payments, and clinical administration." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23005a9c'><path d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/></svg>" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-[#f4f6f8] text-slate-800 flex flex-col min-h-screen">
    
    <!-- Top Navigation Container -->
    <div id="carepulse-header"></div>

    <!-- Main Content -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl w-full mx-auto space-y-6">
      
      <!-- Header -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-2xs flex items-center justify-between">
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Schedule an Appointment</h1>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-50 text-[#005a9c] border border-blue-200">
              Live Provider Roster
            </span>
          </div>
          <p class="text-xs text-slate-500 mt-1">Book an in-person clinic consultation or encrypted virtual telehealth visit.</p>
        </div>
        <a href="/index.html" class="text-xs text-slate-500 hover:text-slate-800 border border-slate-200 px-3 py-1.5 rounded-lg">
          ← Dashboard
        </a>
      </div>

      <!-- Booking Form -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-2xs p-6 sm:p-8">
        <form id="appointment-form" class="space-y-6">
          
          <!-- Step 1: Select Physician -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-3">
              1. Choose Clinical Provider
            </label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="doctor-picker">
              <!-- Rendered by appointments.js -->
            </div>
          </div>

          <!-- Step 2: Visit Type & Location -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                2. Consultation Format
              </label>
              <select name="visitType" class="w-full p-2.5 text-xs bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#005a9c]">
                <option value="In-Person Consultation">In-Person Office Visit (Suite 402)</option>
                <option value="Video Telehealth Visit">Encrypted Telehealth Video Room</option>
                <option value="Routine Lab Follow-up">Phone Consultation Follow-up</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                3. Preferred Date
              </label>
              <input type="date" name="date" value="2026-10-28" min="2026-10-25" class="w-full p-2.5 text-xs bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#005a9c]">
            </div>
          </div>

          <!-- Step 3: Time Slot -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
              4. Preferred Timeslot
            </label>
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
              <label class="p-2 text-center text-xs font-semibold rounded-lg border bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100 cursor-pointer">
                <input type="radio" name="timeSlot" value="09:00 AM" class="hidden">
                <span>09:00 AM</span>
              </label>
              <label class="p-2 text-center text-xs font-semibold rounded-lg border bg-[#005a9c] text-white border-[#005a9c] cursor-pointer">
                <input type="radio" name="timeSlot" value="10:30 AM" checked class="hidden">
                <span>10:30 AM</span>
              </label>
              <label class="p-2 text-center text-xs font-semibold rounded-lg border bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100 cursor-pointer">
                <input type="radio" name="timeSlot" value="11:15 AM" class="hidden">
                <span>11:15 AM</span>
              </label>
              <label class="p-2 text-center text-xs font-semibold rounded-lg border bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100 cursor-pointer">
                <input type="radio" name="timeSlot" value="02:00 PM" class="hidden">
                <span>02:00 PM</span>
              </label>
              <label class="p-2 text-center text-xs font-semibold rounded-lg border bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100 cursor-pointer">
                <input type="radio" name="timeSlot" value="03:30 PM" class="hidden">
                <span>03:30 PM</span>
              </label>
              <label class="p-2 text-center text-xs font-semibold rounded-lg border bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100 cursor-pointer">
                <input type="radio" name="timeSlot" value="04:15 PM" class="hidden">
                <span>04:15 PM</span>
              </label>
            </div>
          </div>

          <!-- Step 4: Visit Reason -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
              5. Chief Complaint / Visit Reason
            </label>
            <textarea name="reason" rows="3" placeholder="Briefly describe your symptoms..." class="w-full p-3 text-xs bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#005a9c]">Follow-up consultation regarding blood pressure medication adjustment.</textarea>
          </div>

          <!-- Summary & Action Buttons -->
          <div class="pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-xs text-slate-500">
              Copay due: <span class="font-bold text-slate-900 text-sm" id="booking-fee-display">$50.00</span>
            </div>

            <div class="flex items-center gap-3 w-full sm:w-auto">
              <button type="submit" data-action="confirm-only" class="flex-1 sm:flex-initial px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl text-xs font-semibold transition">
                Confirm & Pay at Clinic
              </button>
              <button type="submit" data-action="confirm-pay" class="flex-1 sm:flex-initial px-5 py-2.5 bg-[#005a9c] hover:bg-blue-700 text-white rounded-xl text-xs font-semibold shadow-xs transition flex items-center justify-center gap-2">
                <span>Confirm & Pay Now</span>
              </button>
            </div>
          </div>

        </form>
      </div>

      <!-- Current Scheduled Appointments -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-2xs p-6 space-y-4">
        <h2 class="font-bold text-slate-900 text-sm">Your Scheduled Appointments</h2>
        <div id="user-appointments-list" class="space-y-3">
          <!-- Rendered by appointments.js -->
        </div>
      </div>

    </main>

    <script type="module" src="/src/pages/appointments.js"></script>
  </body>
</html>
