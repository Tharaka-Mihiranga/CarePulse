<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarePulse Health Management System</title>
    <meta name="description" content="A unified healthcare platform connecting patient portals, appointment booking, medical records, electronic prescriptions, billing payments, and clinical administration." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23005a9c'><path d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/></svg>" />
    <link rel="stylesheet" href="./src/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* CarePulse Embedded Login Styles */
      :root {
        --cp-primary: #005a9c;
        --cp-bg: #f4f6f8;
      }
      body {
        background-color: var(--cp-bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      svg { max-width: 100%; }
      svg.w-3 { width: 12px !important; height: 12px !important; }
      svg.w-4 { width: 16px !important; height: 16px !important; }
      svg.w-5 { width: 20px !important; height: 20px !important; }
      svg.w-6 { width: 24px !important; height: 24px !important; }
      svg.w-7 { width: 28px !important; height: 28px !important; }
      svg.w-8 { width: 32px !important; height: 32px !important; }
    </style>
  </head>
  <body class="bg-[#f4f6f8] text-slate-800 min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white w-full max-w-md rounded-2xl border border-slate-200 shadow-xl overflow-hidden p-6 sm:p-8 space-y-6">
      
      <!-- Logo & Title -->
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-[#005a9c] text-white flex items-center justify-center mx-auto shadow-md">
          <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>
        </div>
        <h1 class="text-xl font-bold text-slate-900">CarePulse Clinical Portal</h1>
        <p class="text-xs text-slate-500">Sign in with your verified clinical persona</p>
      </div>

      <!-- Persona Selector & Login Form -->
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Select Persona Role</label>
          <select id="login-role-select" class="w-full p-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#005a9c]">
            <option value="patient">Patient (Eleanor Vance)</option>
            <option value="doctor">Doctor (Dr. Sarah Jenkins, MD)</option>
            <option value="administrator">System Administrator (AdminCore)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
          <input type="email" id="login-email" value="e.vance@carepulse.org" required class="w-full p-2.5 text-xs bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#005a9c]">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
          <input type="password" value="••••••••••••" required class="w-full p-2.5 text-xs bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#005a9c]">
        </div>

        <button type="submit" class="w-full py-2.5 bg-[#005a9c] hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-xs transition">
          Sign In to CarePulse
        </button>
      </form>

      <div class="pt-4 border-t border-slate-100 text-center">
        <div class="text-[11px] text-slate-400">
          Protected by HIPAA Security Standards & 256-bit encryption.
        </div>
      </div>

    </div>

    <script type="module" src="./src/pages/login.js"></script>
  </body>
</html>
